<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2"/>
      <stop offset="100%" style="stop-color:#2E86AB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- iOS圆角矩形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#bgGradient)"/>
  <!-- 白色书本 -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- 左页 -->
    <path d="M-100,-120 L-100,120 L-20,120 L-20,-120 Z" fill="white" opacity="0.95"/>
    <!-- 右页 -->
    <path d="M20,-120 L20,120 L100,120 L100,-120 Z" fill="white" opacity="0.9"/>
    <!-- 书脊 -->
    <path d="M-20,-125 L-20,125 L20,125 L20,-125 Z" fill="white"/>
    <!-- 左页线条 -->
    <line x1="-85" y1="-70" x2="-35" y2="-70" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-85" y1="-30" x2="-35" y2="-30" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-85" y1="10" x2="-35" y2="10" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-85" y1="50" x2="-35" y2="50" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="-85" y1="90" x2="-35" y2="90" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <!-- 右页线条 -->
    <line x1="35" y1="-70" x2="85" y2="-70" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="-30" x2="85" y2="-30" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="10" x2="85" y2="10" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="50" x2="85" y2="50" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
    <line x1="35" y1="90" x2="85" y2="90" stroke="#5DADE2" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
